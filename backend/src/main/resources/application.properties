spring.application.name=allinEdu-backend

# ==== Base de datos (PostgreSQL) ====
# Por defecto apunta al Supabase de desarrollo compartido (host y usuario no son
# secretos). La contraseña y el JWT NO se versionan: se piden al equipo y van en
# backend/.env (que Gradle carga para test/bootRun).
# Para usar el Postgres local, define DB_URL/DB_USER/DB_PASSWORD en backend/.env.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USER:edufast}
spring.datasource.password=${DB_PASSWORD:}

# JPA valida el esquema contra las tablas creadas por las migraciones de supabase/migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Desactivado: obliga a que las consultas traigan lo necesario (evita el problema N+1 oculto)
spring.jpa.open-in-view=false

# ==== JWT (login) ====
# En producción, poner la clave real en la variable de entorno JWT_SECRET
allinedu.jwt.secret=${JWT_SECRET:cambia-esta-clave-en-produccion-allinedu-2026-super-secreta-1234567890}
# Expiración del token en milisegundos (86400000 = 1 día)
allinedu.jwt.expiration=86400000

# ==== CORS (frontend web de desarrollo) ====
# Lista de orígenes separados por comas; en producción, el dominio real.
allinedu.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

server.port=8080

# ==== Generación de borradores (Regla 0a: todo lo generado nace sin aprobar) ====
# Sin clave, el botón de generar responde que no está configurado.
allinedu.ai.gemini.api-key=${GEMINI_KEY:}
allinedu.ai.gemini.models=${GEMINI_MODELS:gemini-3.1-flash-lite,gemini-flash-lite-latest}
