plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.edufast'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// ArchUnit: tests automáticos que verifican las reglas de la arquitectura (capas)
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Carga backend/.env (si existe) para que test y bootRun usen las credenciales
// privadas de Supabase sin exportarlas a mano. Las variables del entorno real
// tienen prioridad y los valores vacíos se ignoran (así un .env sin completar
// no anula los defaults de application.properties). No imprime valores.
def dotenv = [:]
def dotenvFile = file('.env')
if (dotenvFile.exists()) {
	dotenvFile.eachLine('UTF-8') { rawLine ->
		def line = rawLine.trim()
		if (!line || line.startsWith('#') || !line.contains('=')) {
			return
		}
		def idx = line.indexOf('=')
		def key = line.substring(0, idx).trim()
		def value = line.substring(idx + 1).trim()
		if (value.length() >= 2 &&
				((value.startsWith("'") && value.endsWith("'")) ||
						(value.startsWith('"') && value.endsWith('"')))) {
			value = value.substring(1, value.length() - 1)
		}
		if (key && value && !System.getenv().containsKey(key)) {
			dotenv[key] = value
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	environment dotenv
}

tasks.named('bootRun') {
	environment dotenv
}
